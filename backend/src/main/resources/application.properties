spring.application.name=QonaqAI
server.address=127.0.0.1
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=QONAQSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
spring.datasource.url=${QONAQ_DB_URL:jdbc:h2:file:./data/qonaqai;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.time-zone=Asia/Qyzylorda
server.error.include-message=never
spring.h2.console.enabled=false
spring.config.import=optional:file:../.tools/ai-local.properties
qonaq.ai.api-key=${GEMINI_API_KEY:}
qonaq.ai.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
